<template>
    <div lwc:dom="manual" class="custom-css-container"></div>

    <div class="tiles-container">
        <div class="tiles-grid">
            <template for:each={tiles} for:item="tile">
                <div key={tile.id}
                     class={tile.class}
                     onclick={tile.click}
                     onkeydown={tile.keydown}
                     tabindex="0"
                     role="link"
                     aria-label={tile.ariaLabel}>

                    <div class={tile.imageContainerClass}>
                        <template lwc:if={tile.showImage}>
                            <img class="tile-image" src={tile.imageUrl}/>
                        </template>
                    </div>

                    <template lwc:if={tile.showTitle}>
                        <div class="tile-title">
                            {tile.title}
                        </div>
                    </template>

                    <template lwc:if={tile.showDescription}>
                        <div class="tile-description">
                            {tile.description}
                        </div>
                    </template>

                </div>

            </template>
        </div>
    </div>
</template>
